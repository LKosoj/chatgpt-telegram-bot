[tool.ruff]
# line-length: E501 (правило "слишком длинная строка") сознательно НЕ включено в select
# ниже, поэтому это значение сейчас ни на что не влияет при `ruff check`. 320 выбрано как
# ориентир на будущее: почти весь код укладывается в него (в дереве ~12 строк длиннее,
# максимум 632 символа в bot/plugins/show_me_diagrams.py).
target-version = "py312"
line-length = 320
exclude = [
    "ai_docs_site",
    ".ai-docs",
    "evals",
    "examples",
]

[tool.ruff.lint]
# Сознательно узкий набор: E4 (import), E7 (statement), E9 (синтаксис/runtime-ошибки)
# + F (pyflakes). Начиная с ruff 0.15 дефолтный набор без конфига гораздо шире (сотни
# правил, ~1900 замечаний на этом дереве), поэтому фиксируем правила явно, чтобы CI
# ловил только реальные ошибки и не менял поведение молча при обновлении ruff
# (см. docs/architecture_code_review_2026-09-04.md §3.4). Расширять набор — отдельной задачей.
select = ["E4", "E7", "E9", "F"]
